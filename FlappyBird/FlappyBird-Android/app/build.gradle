apply plugin: 'com.android.application'

android {
    namespace 'com.doramas.baifobird'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.doramas.baifobird'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Se usa ndk-build porque es la via que SFML soporta oficialmente en
    // Android: su Android.mk se importa desde el NDK (sources/third_party/sfml).
    externalNativeBuild {
        ndkBuild { path 'src/main/jni/Android.mk' }
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
